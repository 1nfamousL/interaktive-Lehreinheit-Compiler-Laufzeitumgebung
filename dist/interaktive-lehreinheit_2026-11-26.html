                <path d="M 29.42 78.51 A 32 32 0 1 0 41.72 23.09" fill="none" style="stroke: var(--linie-grafik)" stroke-width="14"/>
                <polygon points="26.26,27.23 54.75,33.06 48.01,7.94" style="fill: var(--linie-grafik)"/>
              </svg>
            </div>
            <p>Beim Dekodieren findet die CPU heraus, was der Befehl bedeutet. In der \xDCbung hast du das gesehen: Erst wurde die Zeile markiert (der Befehl wird geholt), danach hat sich der Roboter bewegt (der Befehl wird ausgef\xFChrt).</p>
          </div>
        `}},{id:"s3",title:"Sachen: Speicher",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Die \u201ESachen\u201C, also die Daten, liegen im Speicher.</p>
            <p>Die CPU muss die Daten in diesem Speicher gezielt ansprechen k\xF6nnen. Dazu wird der Speicher folgenderma\xDFen organisiert:</p>
            <p>Im Speicher steht alles als Folge von Bits. Ein Bit ist entweder <span class="code-text">0</span> oder <span class="code-text">1</span>. Alle Bits liegen in einer linearen Anordnung hintereinander:</p>
            <div class="memory-box memory-box--fach">
              <div class="memory-col"><span class="memory-byte">0010010100101010010111011010100100101010</span></div>
            </div>
            <p>Je <strong>8 Bits</strong> werden zu einem <strong>Byte</strong> zusammengefasst:</p>
            <div class="memory-box memory-box--fach memory-box--getrennt">
              <div class="memory-col"><span class="memory-byte">00100101</span></div>
              <div class="memory-col"><span class="memory-byte">00101010</span></div>
              <div class="memory-col"><span class="memory-byte">01011101</span></div>
              <div class="memory-col"><span class="memory-byte">10101001</span></div>
              <div class="memory-col"><span class="memory-byte">00101010</span></div>
            </div>
            <p>Ein Byte kann eine Zahl von 0 (<span class="code-text">00000000</span>) bis 255 (<span class="code-text">11111111</span>) darstellen.</p>
          </div>
        `}},{id:"s4",title:"Speicher adressieren",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Jedes Byte bekommt nun eine eindeutige <strong>Adresse</strong>. Dazu werden die Bytes einfach von 0 an hochgez\xE4hlt. Die laufende Nummer ist die Speicheradresse des Bytes.</p>
            <div class="memory-box memory-box--fach memory-box--getrennt">
              <div class="memory-col"><span class="memory-byte">00100101</span><span class="memory-addr">[0]</span></div>

              <div class="memory-col"><span class="memory-byte highlight">01011101</span><span class="memory-addr">[2]</span></div>
              <div class="memory-col"><span class="memory-byte">10101001</span><span class="memory-addr">[3]</span></div>
              <div class="memory-col"><span class="memory-byte">00101010</span><span class="memory-addr">[4]</span></div>
            </div>
            <p>Die CPU kann nun zum Beispiel:</p>
            <ul>
              <li>den Wert von der Speicheradresse <span class="code-text">2</span> lesen (<span class="code-text">01011101</span>)</li>
              <li>ihn als Zahl (93) interpretieren und um 1 erh\xF6hen (94)</li>
              <li>das Ergebnis (<span class="code-text">01011110</span>) wieder an die Speicheradresse <span class="code-text">2</span> schreiben</li>
            </ul>
          </div>

        `}},{id:"s5",title:"Daten im Speicher ablegen",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Um Daten im Speicher abzulegen ben\xF6tigen wir einen neuen Befehl:</p>
            <div class="robot-mblock-placed cg-block cg-xfer cg-ohne-symbol" style="width: fit-content"><span class="cg-name">mov WERT ADRESSE</span></div>
            <p>Der Name kommt vom englischen \u201Emove\u201C. Der Befehl kopiert den Wert in die Adresse.</p>
            <p>Stellen wir uns vor, der Roboter hat f\xFCnf Speicherf\xE4cher mit den Adressen <span class="code-text">[08]</span> bis <span class="code-text">[12]</span>. Der Einfachheit halber bilden wir sie nun mit echten Zahlen ab:</p>
            <div class="memory-box memory-box--fach memory-box--getrennt">
              <div class="memory-col"><span class="memory-byte highlight">0</span><span class="memory-addr">[08]</span></div>
              <div class="memory-col"><span class="memory-byte">2</span><span class="memory-addr">[09]</span></div>
              <div class="memory-col"><span class="memory-byte">5</span><span class="memory-addr">[10]</span></div>
              <div class="memory-col"><span class="memory-byte">9</span><span class="memory-addr">[11]</span></div>
              <div class="memory-col"><span class="memory-byte">6</span><span class="memory-addr">[12]</span></div>
            </div>
            <p>Der Befehl <span class="cg-block cg-xfer cg-ohne-symbol cg-inline">mov 2 [08]</span> f\xFChrt somit dazu, dass der Wert 0 in Adresse <span class="code-text">[08]</span> durch den Wert 2 ersetzt wird.</p>
            <p>Wenn ein Bewegungsbefehl nun diese Adresse referenziert, wird er f\xFCr 2 Felder ausgef\xFChrt.</p>
          </div>
        `}},{id:"s6",title:"Aufteilung in Programm- & Datenspeicher",render:e=>{e.innerHTML=`
          <div class="robot-stage modell-speicher speicher-raster">
            <div class="speicher-text-oben slide-centered slide-lesbar">
            <p>Auch die Befehle sind Daten, die gespeichert werden m\xFCssen, damit die CPU sie ausf\xFChren kann. Der Speicher ist deshalb in zwei Bereiche aufgeteilt: den <strong>Programmspeicher</strong> f\xFCr die Befehle und den <strong>Datenspeicher</strong> f\xFCr die Zahlenwerte. Beide geh\xF6ren zum selben Speicher, d.h. die Adressen laufen durch.</p>
            </div>
            <div class="speicher-text-unten slide-centered slide-lesbar">
            <p>Wie alle Daten stehen auch Befehle im Speicher als Bits. Schreibweisen wie <span class="cg-block cg-move cg-ohne-symbol cg-inline">rgt [08]</span> sind nur eine lesbare Darstellung davon: Der Befehl <span class="lz-fach-inline">rgt</span> ist ein festes Bitmuster. Dahinter steht als Bin\xE4rzahl entweder eine Adresse, wie hier die <span class="lz-fach-inline">[08]</span> in Fach <span class="lz-fach-inline lz-fach-adr">[04]</span>, oder direkt die Zahl selbst, wie bei <span class="cg-block cg-move cg-ohne-symbol cg-inline">up 1</span> in den F\xE4chern <span class="lz-fach-inline lz-fach-adr">[05]</span> und <span class="lz-fach-inline lz-fach-adr">[06]</span>.</p>
            <p>Der Speicher unseres Roboters ist insgesamt 50 F\xE4cher gro\xDF, die Adressen reichen also von <span class="lz-fach-inline lz-fach-adr">[00]</span> bis <span class="lz-fach-inline lz-fach-adr">[49]</span>. Unser kleines Programm passt also locker hinein, die Abbildung zeigt nur den Anfang.</p>
            <p>Je nachdem, wo die Zahl steht, verh\xE4lt sie sich anders. Steht sie direkt im Befehl, liegt sie im Programmspeicher und ist nur f\xFCr diesen einen Befehl verf\xFCgbar. Steht sie im Datenspeicher, ist sie im ganzen Programm verf\xFCgbar, und jeder Befehl kann dieselbe Zahl \xFCber ihre Adresse referenzieren.</p>
            </div>
            ${Ys}
          </div>

          <div class="slide-split">
            <div class="slide-split-text slide-centered slide-lesbar">
            <p>Damit die CPU wei\xDF, welchen Befehl sie als N\xE4chstes ausf\xFChren muss, zeigt der <strong>Befehlsz\xE4hler</strong> auf die entsprechende Adresse im Programmspeicher. Ein <span class="cg-block cg-halt cg-ohne-symbol cg-inline">end</span>-Befehl markiert das Programmende.</p>
            <p>Die CPU holt den Befehl in das <strong>Befehlsregister</strong>, einen kleinen Speicher in der CPU. Beim Dekodieren erkennt sie an der Bitfolge, um welchen Befehl es sich handelt und wie viele der folgenden F\xE4cher (mit Zahlen oder Adressen) dazugeh\xF6ren. Diese F\xE4cher liest sie direkt mit, wobei der Befehlsz\xE4hler pro Fach eine Adresse weiterr\xFCckt. Nach der Ausf\xFChrung steht er so schon auf dem n\xE4chsten Befehl.</p>

            <p>In der Abbildung zeigt der Befehlsz\xE4hler auf <span class="lz-fach-inline lz-fach-adr">[03]</span>, dort steht <span class="lz-fach-inline">rgt</span>. Die CPU erkennt beim Dekodieren, dass im Fach <span class="lz-fach-inline lz-fach-adr">[04]</span> eine Adresse folgt, n\xE4mlich <span class="lz-fach-inline">[08]</span>. Der Roboter bewegt sich also so oft nach rechts, wie in <span class="lz-fach-inline lz-fach-adr">[08]</span> steht. Das ist unsere erste Vorstellung der <strong>Laufzeitumgebung</strong>, in der unser Programm ausgef\xFChrt wird.</p>
            </div>
            <div class="slide-split-figure">${Xs}</div>
          </div>

          <div class="slide-centered slide-lesbar">
            <p>Wir haben mit unserer Robotersprache eine Maschinensprache definiert. Sie bezieht sich direkt auf die Hardware des Roboters. Ein Programm in dieser Sprache liegt als Bitfolge im Programmspeicher und wird direkt von der Maschine ausgef\xFChrt. F\xFCr uns Programmierer ist sie aber umst\xE4ndlich.</p>
            <p>Wir m\xFCssen uns merken, an welcher Adresse welche Zahl steht. Was bedeutet <span class="lz-fach-inline lz-fach-adr">[08]</span>? Eigentlich ist uns egal, wo ein Wert gespeichert wird.</p>
            <p>Auch die Befehle sind nicht leicht zu lesen. F\xFCr den Roboter ist nur wichtig, dass sich die Bitfolgen unterscheiden. Die Namen wie <span class="cg-block cg-xfer cg-ohne-symbol cg-inline">mov</span> oder <span class="cg-block cg-move cg-ohne-symbol cg-inline">rgt</span> sind nur eine lesbare Schreibweise dieser Bitfolgen. Das hilft schon, sagt aber immer noch wenig dar\xFCber, was der Befehl tut.</p>
            <p>Deshalb f\xFChren wir eine zweite Sprache ein, eine sogenannte <strong>Hochsprache</strong>. Sie ist weiter von der Hardware entfernt und deshalb f\xFCr Menschen leichter lesbar. Statt einer Adresse schreiben wir einen Namen, und auch die Befehle bekommen verst\xE4ndliche Namen.</p>
          </div>
        `}},{id:"s2",title:"Die Hochsprache: zwei Bausteine",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Unsere Hochsprache hat zwei Bausteine. Sie entsprechen den beiden Teilen des Modells \u201EMachen mit Sachen\u201C:</p>
            <ul>
              <li>Eine <strong>Deklaration</strong> (Sachen) gibt einer Zahl einen Namen. Man sagt: Die Zahl wird deklariert. Sie besteht aus dem Wort \u201E<span class="code-papier">number</span>\u201C, dem Namen, einem \u201E<span class="code-papier">=</span>\u201C und dem Wert, jede Anweisung endet mit einem Semikolon: <span class="code-papier">number schritte = 2;</span> Der Wert steht danach fest, eine solche benannte Zahl hei\xDFt <strong>Konstante</strong>.</li>
              <li>Eine <strong>Bewegungsanweisung</strong> (Machen) hat ein Klammerpaar, in das eine Zahl oder der Name einer deklarierten Zahl kommt: <span class="code-papier">moveRight(schritte);</span> oder <span class="code-papier">moveUp(1);</span></li>
            </ul>
            <div class="vergleich">
              <div class="robot-card">
                <h2>Robotersprache</h2>
                <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
                  <div class="robot-mblock-placed cg-block cg-xfer cg-ohne-symbol" style="width: fit-content"><span class="cg-name">mov 2 [08]</span></div>
                  <div class="robot-mblock-placed cg-block cg-move cg-ohne-symbol" style="width: fit-content"><span class="cg-name">rgt [08]</span></div>
                  <div class="robot-mblock-placed cg-block cg-move cg-ohne-symbol" style="width: fit-content"><span class="cg-name">up 1</span></div>
                  <div class="robot-mblock-placed cg-block cg-halt cg-ohne-symbol" style="width: fit-content"><span class="cg-name">end</span></div>
                </div>
              </div>
              <div class="robot-card">
                <h2>Hochsprache</h2>
                <span class="slide-code code-papier">number schritte = 2;
moveRight(schritte);
moveUp(1);</span>
              </div>
            </div>
            <p>Welche Adresse hinter dem Namen steckt und ob ein <span class="cg-block cg-xfer cg-ohne-symbol cg-inline">mov</span> n\xF6tig ist, muss der Programmierer nicht mehr wissen. Damit der Roboter dieses Programm ausf\xFChren kann, brauchen wir einen <strong>\xDCbersetzer</strong>, der es in die Maschinensprache bringt.</p>
          </div>
        `}},{id:"s3",title:"Der Compiler",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Hier kommt der <strong>Compiler</strong> ins Spiel, der selbst ein Programm ist. Er schl\xE4gt die Br\xFCcke zwischen Hochsprache und Maschinensprache, indem er Programme aus der Hochsprache in Maschinensprache \xFCbersetzt. Das passiert einmal, bevor das Programm l\xE4uft.</p>
            <p>Daf\xFCr muss er sowohl die Quellsprache als auch die Zielsprache kennen. Das hei\xDFt: F\xFCr jede Kombination aus Quellsprache und Zielsprache gibt es einen eigenen Compiler. Zum Vergleich: Ein Roboter, dessen Hardware anders funktioniert, versteht auch andere Maschinencode-Befehle. F\xFCr ihn braucht man deshalb einen anderen Compiler.</p>
            <div class="fluss fluss-kurz">
              <div class="fluss-sprache fluss-rahmen"><span class="fluss-rolle">Hochsprache:</span><span class="fluss-name">Quellcode</span></div>
              <div class="fluss-pfeil" aria-hidden="true">\u2192</div>
              <div class="fluss-sprache fluss-rahmen"><span class="fluss-rolle">\xDCbersetzung:</span><span class="fluss-name">Compiler</span></div>
              <div class="fluss-pfeil" aria-hidden="true">\u2192</div>
              <div class="fluss-sprache fluss-rahmen"><span class="fluss-rolle">Maschinensprache:</span><span class="fluss-name">Maschinencode</span></div>
              <div class="fluss-pfeil" aria-hidden="true">\u2192</div>
              <div class="fluss-sprache fluss-rahmen"><span class="fluss-rolle">Ausf\xFChrung:</span><span class="fluss-name">Maschine</span></div>
            </div> 
          </div>
        `}},{id:"s4",title:"Maschinennah oder High-Level",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Wie maschinennah eine Programmiersprache ist, bestimmt, wie viele Freiheiten der Programmierer hat und wie viel der Compiler entscheidet.</p>
            <div class="vergleich vergleich--schmal">
              <div class="robot-card robot-card--geteilt">
               <div class="robot-card-teil">
                <h2>Maschinennah (z. B. Assembler)</h2>
                <ul>
                  <li>Das Programm besteht aus vielen kleinschrittigen Befehlen.</li>
                  <li>Die Befehle beschreiben, wie die CPU etwas ausf\xFChrt.</li>
                  <li>Der Programmierer bestimmt genauer, welche Befehle die CPU ausf\xFChrt.</li>
                  <li>Die Programme sind l\xE4nger, schwerer zu lesen und fehleranf\xE4lliger.</li>
                  <li>Erfahrene Programmierer k\xF6nnen den Code gezielt auf Geschwindigkeit optimieren.</li>
                  <li>Das Programm ist an eine bestimmte Hardware gebunden.</li>
                </ul>
               </div>
               <div class="robot-card-teil">
                <h2>Hochsprache (z. B. Java)</h2>
                <ul>
                  <li>Eine Anweisung fasst viele Maschinenbefehle zusammen.</li>
                  <li>Die Anweisungen beschreiben, was das Programm tut, nicht wie die CPU es ausf\xFChrt.</li>
                  <li>Der Compiler entscheidet, welche Maschinenbefehle entstehen.</li>
                  <li>Die Programme sind k\xFCrzer und besser lesbar.</li>
                  <li>\xDCbersetzt der Compiler nicht optimal, l\xE4uft das Programm langsamer.</li>
                  <li>Dasselbe Programm l\xE4sst sich f\xFCr verschiedene Hardware \xFCbersetzen.</li>
                </ul>
               </div>
              </div>
            </div>
          </div>
        `}},{id:"s5",title:"Zwei Wege zur Maschine",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Der Compiler kann auf zwei Wegen zur Maschine f\xFChren: direkt in Maschinencode oder \xFCber einen Zwischencode.</p>
            <div class="vergleich vergleich--schmal">
              <div class="robot-card robot-card--geteilt">
               <div class="robot-card-teil">
                <h2>Direkt in Maschinencode</h2>
                <p><strong>Quellcode \u2192 Compiler \u2192 Maschinencode</strong></p>
                <ul>
                  <li>Der Compiler \xFCbersetzt das Programm vollst\xE4ndig vor dem Start (AOT, Ahead-of-Time).</li>
                  <li>Das Ergebnis ist Maschinencode f\xFCr genau eine Hardware, den die CPU sofort ausf\xFChren kann.</li>
                  <li>Ein Beispiel ist die Programmiersprache \u201EC\u201C.</li>
                  <li>So wird auch unser Robotercode erzeugt.</li>
                </ul>
               </div>
               <div class="robot-card-teil">
                <h2>\xDCber Zwischencode und virtuelle Maschine</h2>
                <p><strong>Quellcode \u2192 Compiler \u2192 Bytecode \u2192 VM \u2192 Maschinencode</strong></p>
                <ul>
                  <li>Der Compiler erzeugt zun\xE4chst einen <strong>Zwischencode</strong>, den <strong>Bytecode</strong>. Er ist nicht an eine bestimmte Hardware gebunden.</li>
                  <li>Der Prozessor versteht den Bytecode nicht direkt. Daf\xFCr gibt es eine <strong>virtuelle Maschine (VM)</strong>: ein Programm, das auf der Hardware l\xE4uft und den Bytecode ausf\xFChrt. Dabei \xFCbersetzt sie ihn erst zur Laufzeit in Maschinencode f\xFCr diese Hardware (JIT, Just-in-Time).</li>
                  <li>Beispiel: Java. Die VM hei\xDFt dort JVM (Java Virtual Machine).</li>
                </ul>
               </div>
              </div>
            </div>
            <p>AOT und JIT sagen nur, <em>wann</em> \xFCbersetzt wird: vor dem Start oder erst w\xE4hrend der Ausf\xFChrung. Der Bytecode ist die Zwischensprache dazwischen.</p>
          </div>
        `}},{id:"s6",title:"Warum der Umweg?",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Stell dir drei Roboter vor. Der Befehl <span class="code-papier">moveRight(2)</span> soll bei allen dasselbe bewirken, aber jede Hardware setzt ihn anders um.</p>
            <div class="vergleich vergleich--schmal">
              <div class="robot-card robot-card--geteilt">
               <div class="robot-card-teil">
                <h2>Kettenroboter</h2>
                <p>F\xE4hrt auf Ketten. Er bekommt den Bytecode und eine VM, die ihn beim Ausf\xFChren in Maschinencode f\xFCr seine Hardware \xFCbersetzt.</p>
                <h2>Laufroboter</h2>
                <p>L\xE4uft auf Beinen. Er bekommt denselben Bytecode, aber eine andere VM, die ihn in Maschinencode f\xFCr seine Hardware \xFCbersetzt.</p>
               </div>
               <div class="robot-card-teil">
                <h2>Mini-Roboter</h2>
                <p>Er hat nur wenig Speicher und Rechenleistung. Eine VM ist selbst ein Programm, das beides braucht, und passt deshalb nicht auf ihn. Sein Programm wird darum schon vorher direkt in Maschinencode \xFCbersetzt (AOT). Das spart Speicher und l\xE4uft schnell, weil zur Laufzeit nichts mehr \xFCbersetzt werden muss. Daf\xFCr gilt dieser Maschinencode nur f\xFCr genau diesen Roboter. F\xFCr einen anderen m\xFCsste man neu \xFCbersetzen.</p>
               </div>
              </div>
            </div>
            <p>Bei direkter \xDCbersetzung (AOT) m\xFCsste man das Programm f\xFCr jeden Roboter einzeln \xFCbersetzen. Mit Bytecode \xFCbersetzt man nur einmal, die jeweilige VM erledigt den Rest. So l\xE4uft dasselbe Java-Programm \xFCberall, wo es eine JVM gibt: <strong>\u201EEinmal geschrieben, \xFCberall lauff\xE4hig.\u201C</strong></p>
          </div>
        `}},{id:"s7",title:"Vervollst\xE4ndige die \xDCbersetzungswege",render:e=>ur(e,{svg:sa,terms:la,zeilenMeldung:aa,hinweis:"Ziehe die Begriffe aus der Leiste in die passenden Felder. So entstehen die beiden Wege vom Quellcode bis zu den Robotern."})}]};var Yt={id:"2-1",title:"2.1 Die 5 Phasen",desc:"Der Weg vom Quellcode zum laufenden Programm in f\xFCnf Phasen.",slides:[{id:"s1",title:"Sprachen haben Regeln",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Gesprochene Sprachen und Programmiersprachen folgen festen Regeln. Ein Compiler \xFCbersetzt ein Programm nicht einfach, er pr\xFCft es vorher auf mehreren Ebenen. Das funktioniert \xE4hnlich wie bei einem Satz im Deutschen.</p>
            <p><strong>W\xF6rter:</strong> Geh\xF6rt das Wort zur Sprache? \u201EHaus\u201C ist ein deutsches Wort, \u201EHasu\u201C nicht.</p>
            <p><strong>Satzbau:</strong> Stehen die W\xF6rter in einer erlaubten Reihenfolge? \u201EDer Hund jagt die Katze\u201C ist ein g\xFCltiger Satz, \u201EJagt Katze der die Hund\u201C nicht.</p>
            <p><strong>Bedeutung:</strong> Ergibt der Satz Sinn? \u201EDer Stein trinkt Kaffee\u201C ist richtig gebaut, aber unsinnig.</p>
            <p>Besteht das Programm alle drei Pr\xFCfungen, \xFCbersetzt der Compiler es in die Sprache, die der Computer ausf\xFChren kann.</p>
          </div>
        `}},{id:"s2",title:"Die f\xFCnf Phasen",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Der Weg vom Quellcode zum laufenden Programm besteht aus f\xFCnf Phasen. Die ersten vier geh\xF6ren zum Compiler und laufen zur \xDCbersetzungszeit, die f\xFCnfte \xFCbernimmt die Laufzeitumgebung zur Laufzeit. Jede Phase baut auf dem Ergebnis der vorherigen auf.</p>
            <p><strong>1. Lexikalische Analyse:</strong> Sie pr\xFCft, ob das Programm nur W\xF6rter und Zeichen enth\xE4lt, die zur Sprache geh\xF6ren.</p>
            <p><strong>2. Syntaxanalyse:</strong> Sie pr\xFCft, ob die W\xF6rter in einer Reihenfolge stehen, die die Grammatik erlaubt.</p>
            <p><strong>3. Semantische Analyse:</strong> Sie pr\xFCft, ob das Programm Sinn ergibt, zum Beispiel ob jede verwendete Konstante vorher angelegt wurde und die Typen zusammenpassen.</p>
            <p><strong>4. Codegenerierung:</strong> Sie \xFCbersetzt das gepr\xFCfte Programm in Maschinencode, den der Computer ausf\xFChren kann.</p>
            <p><strong>5. Laden und Ausf\xFChren:</strong> Die Laufzeitumgebung l\xE4dt den \xFCbersetzten Code in den Speicher und f\xFChrt ihn aus.</p>
            <p>Im Folgenden durchlaufen wir alle f\xFCnf Phasen mit unserem Beispielcode aus Kapitel 1.</p>
          </div>
        `}}]};var pr=[{id:"identifier",label:"Bezeichner",color:"var(--c-identifier)"},{id:"keyword",label:"Schl\xFCsselwort",color:"var(--c-keyword)"},{id:"literal",label:"Literal",color:"var(--c-literal)"},{id:"operator",label:"Operatoren",color:"var(--c-operator)"},{id:"separator",label:"Gliederungszeichen",color:"var(--c-separator)"},{id:"error",label:"Lexikalische Fehler",color:"var(--c-error)"}],ei={id:"radierer",label:"Farbe entfernen",color:"var(--text-dim)"},oa=["==","!=","<=",">="];function da(e,n,t){let i=g=>/[A-Za-z]/.test(g),r=g=>/[A-Za-z0-9]/.test(g),a=g=>/[0-9]/.test(g),o=[],p=e.length,x=0;for(;x<p;){let g=e[x],y=x+1,T;if(/\s/.test(g)){x=y;continue}if(i(g)){for(;y<p&&r(e[y]);)y++;let d=e.slice(x,y);T=n.has(d)?"keyword":t.has(d)?"literal":"identifier"}else if(a(g)){for(;y<p&&a(e[y]);)y++;T="literal"}else"();.{}".includes(g)?T="separator":oa.includes(e.substr(x,2))?(y=x+2,T="operator"):"=+-*/<>".includes(g)?T="operator":T="error";o.push({start:x,end:y,type:T}),x=y}return o}function yt(e,n){let t=n.code,i="Alle Tokens richtig klassifiziert. Der Quellcode ist lexikalisch einwandfrei.",r=n.werkzeuge?pr.filter(k=>n.werkzeuge.includes(k.id)):pr,a=da(t,new Set(n.schluesselwoerter??[]),new Set(n.literalwoerter??[])),o=new Array(t.length).fill(null),p=0,x=r[0].id,g=null,y=null,T=!1,d=!1,v=!1;e.innerHTML=`

gabe",kapitel:3,ziel:"lexik",text:"Leerzeichen und Zeilenumbr\xFCche verwerfen",warum:"Leerzeichen und Zeilenumbr\xFCche trennen die W\xF6rter, sind aber selbst keine Tokens."},{id:"l3",art:"aufgabe",kapitel:4,ziel:"lexik",text:"Tokens einer Tokengruppe zuordnen",warum:"Schl\xFCsselwort, Bezeichner, Literal, Operator, Gliederungszeichen: Jedes Token geh\xF6rt zu einer Tokengruppe."},{id:"l4",art:"aufgabe",kapitel:4,ziel:"lexik",text:"Das l\xE4ngste passende Token lesen",warum:"<= ist ein Token und nicht < und =. Der Scanner liest immer das l\xE4ngste Token, das passt."},{id:"s1",art:"aufgabe",kapitel:4,ziel:"syntax",text:"Pr\xFCfen, ob die Tokens zur Grammatik passen",warum:"Der Parser pr\xFCft, ob die Tokens in einer Reihenfolge stehen, die die Grammatik erlaubt."},{id:"s2",art:"aufgabe",kapitel:2,ziel:"syntax",text:"Den Syntaxbaum aufbauen",warum:"Aus den Tokens entsteht ein Baum: oben das Programm, unten die Tokens."},{id:"s3",art:"aufgabe",kapitel:3,ziel:"syntax",text:"Tokens zu Anweisungen und Ausdr\xFCcken zusammenfassen",warum:"Der Parser fasst Tokens zu Sprachkonstrukten zusammen, etwa zu einer Zuweisung oder einer Rechnung."},{id:"s4",art:"aufgabe",kapitel:4,ziel:"syntax",text:"Tokens zwischen { und } zu einem Block zusammenfassen",warum:"Ob zu einem if ein Block mit { und } geh\xF6rt, ist eine Frage des Satzbaus. Das pr\xFCft der Parser."},{id:"m1",art:"aufgabe",kapitel:2,ziel:"semantik",text:"Namen in der Symboltabelle eintragen und nachschlagen",warum:"Jede Deklaration tr\xE4gt Name und Typ in die Symboltabelle ein. Wo ein Name benutzt wird, schl\xE4gt die Semantik ihn nach: Er muss deklariert sein, und sein Typ steht dort."},{id:"m3",art:"aufgabe",kapitel:3,ziel:"semantik",text:"Zahlen im Quellcode auf 0 bis 255 pr\xFCfen",warum:"Die Grammatik sieht nur \u201Eeine Zahl\u201C. Ob der Wert erlaubt ist, wird erst hier gepr\xFCft."},{id:"m4",art:"aufgabe",kapitel:4,ziel:"semantik",text:"Typen pr\xFCfen",warum:"Rechnen braucht number, eine Bedingung braucht boolean. Das pr\xFCft die Semantik, die Grammatik kennt keine Typen."},{id:"m5",art:"aufgabe",kapitel:5,ziel:"semantik",text:"G\xFCltigkeitsbereich eines Blocks verwalten",warum:"Jeder Block bekommt in der Symboltabelle einen eigenen Bereich. Namen aus dem Block sind au\xDFerhalb nicht sichtbar."},{id:"c1",art:"aufgabe",kapitel:2,ziel:"codegen",text:"Baum in Maschinenbefehle \xFCbersetzen",warum:"Der Compiler geht den Baum durch und erzeugt f\xFCr jeden Teil Befehle nach einem festen Muster."},{id:"c2",art:"aufgabe",kapitel:4,ziel:"codegen",text:"Relative Adressen (D1), (Z1) vergeben",warum:"Der Compiler kennt die echten Adressen nicht. Er schreibt (D1) f\xFCr Daten und (Z1) f\xFCr Zeilen, die echten Adressen kennt erst die Laufzeitumgebung."},{id:"c3",art:"aufgabe",kapitel:3,ziel:"codegen",text:"Befehl end ans Ende des Maschinencodes schreiben",warum:"Ohne end liefe die CPU hinter den letzten Befehl."},{id:"c4",art:"aufgabe",kapitel:3,ziel:"codegen",text:"Ladebefehle f\xFCr die Register erzeugen",warum:"Gerechnet wird in den Registern A und B. Der Compiler erzeugt Befehle, die die Werte aus dem Datenspeicher dorthin laden, rechnen und das Ergebnis zur\xFCckschreiben."},{id:"c5",art:"aufgabe",kapitel:4,ziel:"codegen",text:"Vergleichsbefehl mit umgekehrtem Operator erzeugen",warum:"Aus if (a > 2) wird ein Vergleich a <= 2 mit einem Sprung hinter den Block: Trifft der umgekehrte Vergleich zu, wird der Block \xFCbersprungen."},{id:"c6",art:"aufgabe",kapitel:5,ziel:"codegen",text:"Sprungbefehl hinter dem Block erzeugen",warum:"Aus if oder while wird der Befehl jif, der bei gesetztem Flag hinter den Block springt."},{id:"c7",art:"aufgabe",kapitel:5,ziel:"codegen",text:"Sprungbefehl zur\xFCck zur Bedingung erzeugen",warum:"Am Ende des Rumpfes springt ein jmp zur\xFCck zur Bedingung. So wird derselbe Code wiederholt."},{id:"r1",art:"aufgabe",kapitel:2,ziel:"laufzeit",text:"Programm laden, Adressen umrechnen",warum:"Der Lader legt das Programm in den Speicher und macht aus im Fahren."},{id:"f7",art:"fehler",kapitel:3,ziel:"syntax",etikett:"Wert fehlt",text:"number a = 1 +;",warum:"Nach dem + fehlt der zweite Wert. Die W\xF6rter sind alle g\xFCltig, nur der Satzbau stimmt nicht."},{id:"f4",art:"fehler",kapitel:3,ziel:"semantik",etikett:"Doppelt deklariert",text:"number a = 1; number a = 2;",warum:"Der Aufbau ist g\xFCltig, aber der Name a ist schon vergeben. Das wei\xDF nur die Symboltabelle."},{id:"f8",art:"fehler",kapitel:3,ziel:"semantik",etikett:"Zahl \xFCber 255",text:"number a = 300;",warum:"W\xF6rter und Aufbau stimmen, aber 300 liegt au\xDFerhalb von 0 bis 255. Eine Zahl im Quellcode pr\xFCft die Semantik."},{id:"f9",art:"fehler",kapitel:3,ziel:"laufzeit",etikett:"Ergebnis zu gro\xDF",text:"number a = 200 + 100;",warum:"Beide Zahlen sind g\xFCltig. Das Ergebnis 300 entsteht erst bei der Ausf\xFChrung, dort meldet die Laufzeitumgebung den \xDCberlauf."},{id:"f10",art:"fehler",kapitel:3,ziel:"laufzeit",etikett:"Durch 0 geteilt",text:"number a = 6 / 0;",warum:"Der Compiler hat an W\xF6rtern, Aufbau und Typen nichts auszusetzen. Dass durch 0 geteilt wird, zeigt sich erst bei der Ausf\xFChrung."},{id:"f12",art:"fehler",kapitel:4,ziel:"lexik",etikett:"Einzelnes !",text:"if (a ! 2) { }",warum:"Ein ! allein ist kein Token, nur != ist eines. Der Scanner meldet es, bevor der Parser etwas sieht."},{id:"f13",art:"fehler",kapitel:4,ziel:"syntax",etikett:"Schlie\xDFende Klammer fehlt",text:"if (a > 2) { moveUp(1);",warum:"Jedes Token ist g\xFCltig, aber der Block wird ge\xF6ffnet und nie geschlossen. Nach der Anweisung erwartet der Parser eine weitere Anweisung oder die schlie\xDFende Klammer."},{id:"f14",art:"fehler",kapitel:4,ziel:"syntax",etikett:"Block fehlt",text:"if (a > 2) moveUp(1);",warum:"Nach der Bedingung muss ein Block mit { und } stehen. Das ist eine Frage des Satzbaus."},{id:"f15",art:"fehler",kapitel:4,ziel:"semantik",etikett:"Typfehler",text:"if (3) { }",warum:"Der Aufbau ist g\xFCltig, aber eine Bedingung muss ein boolean sein. Eine Zahl ist ein Typfehler."},{id:"f16",art:"fehler",kapitel:5,ziel:"syntax",etikett:"Klammern fehlen",text:"while n > 0 { }",warum:"Die Bedingung der Schleife steht in runden Klammern. Ohne sie passt keine Regel der Grammatik."},{id:"f18",art:"fehler",kapitel:5,ziel:"semantik",etikett:"Typfehler",text:"while (3) { }",warum:"Der Aufbau ist g\xFCltig, aber auch die Bedingung einer Schleife muss ein boolean sein. Eine Zahl ist ein Typfehler."},{id:"f17",art:"fehler",kapitel:5,ziel:"laufzeit",etikett:"Schleife endet nie",text:"while (3 > 0) { }",warum:"Der Compiler findet nichts auszusetzen. Dass die Schleife nie endet, merkt erst die Laufzeitumgebung, weil sie immer denselben Zustand sieht."}],Tn=e=>Ct.filter(n=>n.kapitel<=e),Cn=e=>Ct.filter(n=>n.kapitel===e);var el=()=>ye(fe("number","schritte",j(2)),ge("rechts",se("schritte")),ge("oben",j(1))),nl=()=>ye(fe("number","schritte",j(5)),ge("rechts",se("schritte")),ge("oben",j(1))),xi=(e,n)=>`<span class="cg-block cg-${e} cg-ohne-symbol cg-inline">${n}</span>`,Gr=e=>`<span class="code-papier">${e}</span>`,Fn=e=>`<span class="lz-fach-inline lz-fach-adr">${e}</span>`,tl=[["(Z1)","xfer","mov 3 \u2192 (D1)"],["(Z2)","move","lft (D1)"],["(Z3)","halt","end"]],il=[["[00]","mov"],["[01]","3"],["[02]","[06]"],["[03]","lft"],["[04]","[06]"],["[05]","end"]],Ei={id:"2-6",title:"2.6 Laufzeitumgebung: Laden und Ausf\xFChren",desc:"Der Lader legt das Programm in den Speicher, die CPU f\xFChrt es aus.",slides:[{id:"s1",title:"\xDCbersetzungszeit und Laufzeit",text:["Mit dem Maschinencode ist die Arbeit des Compilers beendet. Man unterscheidet deshalb zwei Zeitpunkte: die <strong>\xDCbersetzungszeit</strong>, in der der Compiler arbeitet, und die <strong>Laufzeit</strong>, in der das fertige Programm l\xE4uft.","Ausgef\xFChrt wird es von der <strong>Laufzeitumgebung</strong>. Bei unserem Roboter ist das die CPU mit dem Speicher aus Kapitel 1.","Fehler, die der Compiler nicht erkennen kann, zeigen sich erst zur Laufzeit. Dann h\xE4lt die Laufzeitumgebung das Programm an."]},{id:"s2",title:"Der Lader",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Der Maschinencode kennt nur relative Angaben wie (Z1) und ${Fn("(D1)")}. Bevor die CPU ihn ausf\xFChren kann, muss er in den Speicher. Das erledigt der <strong>Lader</strong>: Er legt das Programm in den Programmspeicher und rechnet die relativen Angaben in echte Adressen um.</p>
            <p>Dabei wird jeder Befehl in F\xE4cher zerlegt, eines f\xFCr den Befehl und je eines f\xFCr jede Zahl und jede Adresse dahinter. Der Datenspeicher beginnt direkt hinter dem letzten Programmfach. Aus ${Fn("(Dk)")} wird die Adresse Datenanfang + k \u2212 1.</p>
            <p>Im Beispiel liegt das Programm in ${Fn("[00]")} bis ${Fn("[05]")}, der Datenspeicher beginnt bei ${Fn("[06]")}, und aus ${Fn("(D1)")} wird ${Fn("[06]")}.</p>
            <div class="lader-abbildung">
              <div class="robot-build lz-prog">
                <div class="robot-ref-title">Maschinencode</div>
                ${tl.map(([n,t,i])=>`
                <div class="robot-mrow lz-row">
                  <span class="robot-lineno">${n}</span>
                  <div class="robot-mblock-placed cg-block cg-${t} cg-ohne-symbol"><span class="cg-name">${i}</span></div>
                </div>`).join("")}
              </div>
              <div class="lader-pfeil" aria-hidden="true"><span>Lader</span>\u2192</div>
              <div class="robot-build lz-prog">
                <div class="robot-ref-title">Programmspeicher</div>
                ${il.map(([n,t])=>`
                <div class="robot-mrow lz-row">
                  <div class="robot-mblock-placed lz-fach"><span class="lz-adr-im-fach">${n}</span><span class="lz-fach-text">${t}</span></div>
                </div>`).join("")}
              </div>
              <div class="robot-card lader-daten">
                <div class="cg-sub cg-mem-title">Datenspeicher</div>
                <div class="cg-mem-grid"><div class="cg-mem-cell lz-feld"><span class="cg-mem-addr">[06]</span><span class="lz-val">&#8203;</span></div></div>
              </div>
            </div>
          </div>
        `}},{id:"s3",title:"Ladefehler",text:[`Der Speicher unseres Roboters hat 50 F\xE4cher, f\xFCr Programm und Daten zusammen. Braucht ein Programm mehr, lehnt der Lader es ab, bevor etwas ausgef\xFChrt wird. Ein Programm mit 13 Deklarationen (${Gr("number a1 = 1;")} bis ${Gr("number a13 = 1;")}) belegt zum Beispiel 53 F\xE4cher.`,"Die Sprache kennt keine solche Grenze, nur die Maschine. Der Compiler kennt die Gr\xF6\xDFe des Speichers nicht und meldet deshalb nichts."]},{id:"s4",title:"Ausf\xFChren",text:["Die CPU arbeitet jeden Befehl in drei Phasen ab: holen, dekodieren, ausf\xFChren. Beim Dekodieren erkennt sie am Befehl, wie viele F\xE4cher dahinter zu ihm geh\xF6ren, und liest sie. Der Befehlsz\xE4hler z\xE4hlt dabei mit jedem gelesenen Fach um eins weiter und zeigt nach dem letzten Fach des Befehls schon auf den n\xE4chsten.",`Der Datenspeicher \xE4ndert sich nur durch ${xi("xfer","mov")}. Die Bewegungsbefehle bewegen den Roboter. Das Fach einer Konstanten wird einmal beschrieben und danach nur noch gelesen. Das Programm ist zu Ende, wenn die CPU auf ${xi("halt","end")} trifft.`]},{id:"s5",title:"Laufzeitfehler",text:["Manche Fehler lassen sich erst zur Laufzeit erkennen. F\xE4hrt der Roboter gegen ein Hindernis, h\xE4lt die Laufzeitumgebung das Programm an. Der Compiler konnte das nicht wissen: Wie gro\xDF das Feld ist und wo Hindernisse stehen, wei\xDF nur die Maschine, nicht die Sprache.",`Dass die CPU hinter das Programmende l\xE4uft, kann dagegen nicht passieren: Der Compiler setzt immer ein ${xi("halt","end")}.`,"Auf den n\xE4chsten Folien f\xFChrst du das Programm selbst aus: Du l\xE4dst den Maschinencode in den Speicher und l\xE4sst die CPU ihn Fach f\xFCr Fach abarbeiten. Beobachte dabei, wie sich Datenspeicher und Roboter ver\xE4ndern."]},{id:"s6",title:"Lass den Code laufen: Fach f\xFCr Fach",render:e=>me(e,{phase:"laufzeit",baum:el,start:{c:2,r:3},hindernisse:[{c:2,r:1},{c:5,r:1},{c:1,r:4},{c:4,r:5}],sichtbar:{register:!1,flag:!1}})},{id:"s7",title:"Lass den Code laufen: Hindernis",render:e=>me(e,{phase:"laufzeit",baum:nl,start:{c:2,r:3},hindernisse:[{c:2,r:1},{c:5,r:1},{c:1,r:4},{c:4,r:5}],sichtbar:{register:!1,flag:!1},fehlerIstZiel:!0})},{id:"s8",title:"Der ganze Weg im \xDCberblick",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Damit kennst du alle Stationen vom Quellcode bis zum laufenden Programm. Lexikalische Analyse, Syntaxanalyse, semantische Analyse und Codegenerierung bilden den <strong>Compiler</strong> und arbeiten zur \xDCbersetzungszeit. Laden und Ausf\xFChren \xFCbernimmt danach die <strong>Laufzeitumgebung</strong>, zur Laufzeit.</p>
            <p>Jede Station bekommt etwas von der vorigen und gibt etwas an die n\xE4chste weiter: Aus dem Quellcode werden Tokens, daraus ein Syntaxbaum, der gepr\xFCft wird, daraus der Maschinencode, und der wird zu einem laufenden Programm.</p>
            <p>Auf der n\xE4chsten Folie siehst du diese Kette wieder. Du bekommst nacheinander Karten und ordnest jede der Stelle zu, an die sie geh\xF6rt. Eine Karte zeigt entweder eine Ein- oder Ausgabe zwischen zwei Phasen, eine Aufgabe, die eine Phase erledigt, oder einen Fehler, der in einer Phase auff\xE4llt.</p>
          </div>
        `}},{id:"zuordnung",title:"Ordne den Phasen zu: Die Phasen im \xDCberblick",render:e=>gn(e,{ziele:bn,gruppen:fn,karten:Cn(2),vorbefuellt:Tn(1)})}]};var Hn=e=>`<span class="code-papier">${e}</span>`,rl=e=>`<span class="slide-code code-papier">${e}</span>`,sl=rl(`number weg = 4 + 3;
weg = 10 - weg;
moveRight(weg);`),Si={id:"3-1",title:"3.1 Zuweisung und Rechnung",desc:"Aus Konstanten werden Variablen, und die Sprache lernt zu rechnen.",slides:[{id:"s1",title:"Von der Konstante zur Variable",text:[`In Kapitel 2 hat eine Deklaration wie ${Hn("number schritte = 2;")} einer Zahl einen Namen gegeben. Der Wert stand danach fest, wir haben ihn eine <strong>Konstante</strong> genannt.`,`Dabei bleibt es nicht. Ab jetzt darf sich ein Wert im Lauf des Programms \xE4ndern. Eine benannte Zahl, die sich \xE4ndern l\xE4sst, hei\xDFt <strong>Variable</strong>. Die Deklaration schreibst du weiter wie bisher: ${Hn("number a = 1;")}`,`Den Wert einer Variablen \xE4ndert die <strong>Zuweisung</strong>. Sie \xFCberschreibt ihn: ${Hn("a = 5;")} Nach ${Hn("number a = 1;")} und ${Hn("a = 5;")} hat \u201Ea\u201C den Wert 5, der alte Wert ist weg.`,"Die Zuweisung sieht aus wie eine Deklaration, nur ohne das Wort \u201Enumber\u201C. Die Deklaration legt eine Variable neu an, die Zuweisung \xE4ndert eine, die es schon gibt. Der Name muss also vorher deklariert worden sein."]},{id:"s2",title:"Rechnungen und Bewegungen",text:[`Rechts vom \u201E=\u201C steht bisher ein einzelner Wert. Neu darf dort auch eine <strong>Rechnung</strong> stehen: ${Hn("number weg = a + 3;")}`,"Es gibt vier Rechenzeichen: \u201E+\u201C, \u201E-\u201C, \u201E*\u201C und \u201E/\u201C. Eine Rechnung hat genau eines davon und zwei Werte, jeder Wert ist eine Zahl oder ein Name.",`Bewegungsanweisungen d\xFCrfen weiterhin einen Namen in die Klammer nehmen: ${Hn("moveRight(weg);")} Der Roboter bewegt sich so weit, wie der letzte Wert von \u201Eweg\u201C angibt. Hat sich \u201Eweg\u201C vorher durch eine Zuweisung ge\xE4ndert, gilt der neue Wert.`]},{id:"s3",title:"Das Beispielprogramm von Kapitel 3",text:["Dieses Programm begleitet uns durch alle Phasen des Kapitels. Der Roboter startet auf dem Feld (1, 3) und soll am Ende auf dem Feld (4, 3) stehen:",sl,"Wie in Kapitel 2 gehen wir den Weg des Compilers Phase f\xFCr Phase durch und schauen jeweils, was durch Zuweisung und Rechnung neu hinzukommt."]}]};var al="number weg = 4 + 3;Number a = 10 - weg;moveRight(a);",kn=(e,n)=>`<span class="token-marke lex-mark-${e}">${n}</span>`,ll=e=>`<span class="code-papier">${e}</span>`,Bi={id:"3-2",title:"3.2 Lexik: Rechenzeichen und Schreibweise",desc:"Rechenzeichen sind eigene Tokens, ein falsch geschriebenes Schl\xFCsselwort ist ein Bezeichner.",slides:[{id:"s1",title:"Was ist neu?",render:e=>{let n=(t,i)=>`<span class="token-marke lex-mark-${t} token-marke--neu">${i}</span>`;e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Der Scanner arbeitet wie in Kapitel 2. Neu sind nur die vier Rechenzeichen ${n("operator","+")} ${n("operator","-")} ${n("operator","*")} ${n("operator","/")}. Sie sind Operatoren, so wie das ${kn("operator","=")}.</p>
            <p>In unserer Sprache gibt es keine negativen Zahlen, deshalb ist \u201E-\u201C immer ein eigenes Token, und aus ${ll("-1")} werden die zwei Tokens ${kn("operator","-")} und ${kn("literal","1")}. Ob das an dieser Stelle erlaubt ist, entscheidet erst der Parser.</p>
            <p>Schreibst du ein Schl\xFCsselwort falsch, zum Beispiel \u201EMoveRight\u201C statt \u201EmoveRight\u201C, sieht das f\xFCr uns nach einer falschen Zuordnung aus. Der Scanner kennt aber nur die W\xF6rter seiner Liste, und \u201EMoveRight\u201C steht nicht darin. F\xFCr ihn ist es ein Bezeichner wie jeder andere, und das ist v\xF6llig legitim. Der Fehler f\xE4llt deshalb erst in einer sp\xE4teren Phase auf.</p>
            <p>Hier alle Tokens unserer Sprache, geordnet nach Gruppen:</p>
            <div class="robot-card token-uebersicht-fenster">
            <div class="token-uebersicht">
              <span class="token-uebersicht-gruppe">Schl\xFCsselw\xF6rter</span>
              <span>${["number","moveUp","moveDown","moveRight","moveLeft"].map(t=>kn("keyword",t)).join(" ")}</span>
              <span class="token-uebersicht-gruppe">Bezeichner</span>
              <span>${kn("identifier","a")} ${kn("identifier","weg")} <span class="grammatik-zeichen">\u2026 selbst gew\xE4hlte Namen</span></span>
              <span class="token-uebersicht-gruppe">Literale</span>
              <span>${kn("literal","1")} ${kn("literal","255")} <span class="grammatik-zeichen">\u2026 Zahlen</span></span>
              <span class="token-uebersicht-gruppe">Operatoren</span>
              <span>${kn("operator","=")} ${n("operator","+")} ${n("operator","-")} ${n("operator","*")} ${n("operator","/")}</span>
              <span class="token-uebersicht-gruppe">Gliederungszeichen</span>
              <span>${["(",")",";"].map(t=>kn("separator",t)).join(" ")}</span>
            </div>
            </div>
            <p>Auf der n\xE4chsten Folie f\xE4rbst du wieder alle Tokens ein.</p>

          <div class="slide-centered slide-lesbar">
            <p>Der Compiler erzeugt wie in Kapitel 2 Maschinencode mit relativen Adressen. Eine Zuweisung \xFCbersetzt er genauso wie eine Deklaration, n\xE4mlich in einen ${je("xfer","mov")}-Befehl, der eine Zahl in eine Datenzelle schreibt: ${je("xfer","mov 5 \u2192 (D1)")}. Der Unterschied liegt nur in der Datenzelle: Bei der Deklaration vergibt der Compiler eine neue, bei der Zuweisung schreibt ${je("xfer","mov")} in die Datenzelle einer Variablen, die es schon gibt.</p>
            <p>Neu ist, dass der Compiler auch Rechnungen \xFCbersetzen muss. Daf\xFCr gibt es f\xFCr jede Rechenart einen eigenen Befehl: ${je("calc","+")}, ${je("calc","-")}, ${je("calc","*")} und ${je("calc","/")}. Diese Befehle brauchen aber eine neue Art von Speicher, denn die CPU kann Werte im Datenspeicher nicht direkt verrechnen.</p>

            <p><strong>\xDCberlauf:</strong> Das Ergebnis ist gr\xF6\xDFer als 255, zum Beispiel ${Rt("200 + 100")}.<br><strong>Unterlauf:</strong> Das Ergebnis ist kleiner als 0, zum Beispiel ${Rt("1 - 5")}.</p>

1C (gr\xF6\xDFer), \u201E<=\u201C (kleiner oder gleich), \u201E>=\u201C (gr\xF6\xDFer oder gleich), \u201E==\u201C (gleich) und \u201E!=\u201C (ungleich).","Vorsicht bei \u201E=\u201C und \u201E==\u201C: Ein einfaches \u201E=\u201C speichert einen Wert in eine Variable, ein doppeltes \u201E==\u201C fragt, ob zwei Werte gleich sind.",`Ein Vergleich ist ein Ausdruck, so wie eine Rechnung. Man kann sein Ergebnis deshalb in einer Variablen speichern: ${wn("boolean weit = schritte > 2;")}`]},{id:"s4",title:"Die if-Anweisung und der Block",text:["Mit der <strong>if-Anweisung</strong> h\xE4ngt man Teile des Programms an eine Bedingung. Sie besteht aus dem Wort \u201Eif\u201C, einer Bedingung in runden Klammern und einem Block:",ns(`if (schritte > 2) {

            <p>Er nimmt immer das <strong>l\xE4ngste St\xFCck, das noch zu einem Token passt</strong>. Sieht er ein \u201E<\u201C, schaut er auf das n\xE4chste Zeichen: Ist es ein \u201E=\u201C, ist beides zusammen das Token ${We("operator","<=")}. Sonst ist es nur ${We("operator","<")}. In ${Ri("schritte <= 7")} sind es also drei Tokens ${We("identifier","schritte")} ${We("operator","<=")} ${We("literal","7")} und nicht vier.</p>

          <div class="slide-centered slide-lesbar">
            <p>Der Compiler erzeugt wie bisher Maschinencode mit relativen Adressen. Neu ist, dass das Programm nicht mehr nur von oben nach unten l\xE4uft: Ein Block soll nur ausgef\xFChrt werden, wenn eine Bedingung stimmt. Daf\xFCr braucht die CPU zwei neue Dinge, ein Flag und Sprungbefehle.</p>
            <p>Das <strong>Flag</strong> ist ein weiterer Zwischenspeicher in der CPU, neben den Registern. Es kennt nur zwei Zust\xE4nde: gesetzt (wahr) oder nicht gesetzt (falsch).</p>
            <p>Gesetzt wird es von den <strong>Vergleichsbefehlen</strong>. Es gibt f\xFCr jeden Vergleichsoperator einen: ${$e("cmp","&lt;")} ${$e("cmp","&gt;")} ${$e("cmp","&lt;=")} ${$e("cmp","&gt;=")} ${$e("cmp","==")} ${$e("cmp","!=")}. Sie haben zwei Parameter, jeder ist eine Zahl oder ein Register. Ein Vergleichsbefehl schreibt in kein Register, er setzt nur das Flag: ${$e("cmp","&gt;= A, 5")} setzt es, wenn der Wert in A gr\xF6\xDFer oder gleich 5 ist.</p>
            <p>Eine Zahl steht direkt im Befehl. Eine Variable muss der Compiler vorher mit ${$e("xfer","mov")} in ein Register laden, denn Vergleichsbefehle lesen den Datenspeicher nicht.</p>
            <p>Auch Wahrheitswerte m\xFCssen im Speicher stehen. Der Compiler speichert ${dt("true")} als 1 und ${dt("false")} als 0.</p>
          </div>
        `}},{id:"s2",title:"Spr\xFCnge und if",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Normalerweise liest die CPU einen Befehl nach dem anderen. Ein <strong>Sprungbefehl</strong> setzt stattdessen den Befehlsz\xE4hler auf eine andere Zeile, die als Ziel im Befehl steht. ${$e("jump","jmp (Z4)")} springt immer. ${$e("jump","jif (Z4)")} springt nur, wenn das Flag gesetzt ist, sonst geht es mit dem n\xE4chsten Befehl weiter.</p>
            <p>Damit l\xE4sst sich eine if-Anweisung \xFCbersetzen. Ist die Bedingung falsch, soll der Block <strong>\xFCbersprungen</strong> werden. Weil ${$e("jump","jif")} bei gesetztem Flag springt, muss das Flag bei einer falschen Bedingung gesetzt sein. Der Compiler vergleicht deshalb mit dem <strong>umgekehrten Operator</strong>: Aus ${$e("cmp","&lt;")} wird ${$e("cmp","&gt;=")}, aus ${$e("cmp","&gt;")} wird ${$e("cmp","&lt;=")}, aus ${$e("cmp","==")} wird ${$e("cmp","!=")}, und jeweils umgekehrt.</p>
            <p>Der Block selbst erzeugt keinen eigenen Code, nur seine Anweisungen. Hier der Weg f\xFCr das Programm: ${dt("number x = 2; if (x &lt; 5) { moveLeft(1); }")}</p>
            <p>(Z1) ${$e("xfer","mov 2 \u2192 (D1)")} Die Deklaration von x bekommt eine neue Datenzelle, die Zahl 2 kommt direkt hinein.</p>
            <p>(Z2) ${$e("xfer","mov (D1) \u2192 A")} F\xFCr den Vergleich wird x in das Register A geladen.</p>
            <p>(Z3) ${$e("cmp","&gt;= A, 5")} Die Bedingung ist x &lt; 5, der Compiler vergleicht mit dem umgekehrten Operator. Das Flag ist gesetzt, wenn die Bedingung falsch ist.</p>
            <p>(Z4) ${$e("jump","jif (Z6)")} Ist das Flag gesetzt, springt die CPU hinter den Block.</p>
            <p>(Z5) ${$e("move","lft 1")} Der Block. Hier kommt die CPU nur hin, wenn die Bedingung wahr war.</p>
            <p>(Z6) ${$e("halt","end")} Das Programm ist zu Ende.</p>
            <p>Auf der n\xE4chsten Folie setzt du den Maschinencode wieder aus Bausteinen zusammen.</p>
          </div>
        `}},{id:"s3",title:"\xDCbersetze den Code: Vergleiche und Spr\xFCnge",render:e=>me(e,{phase:"codegen",baum:Hl,quelltext:Fl,start:{c:1,r:3},hindernisse:[{c:2,r:4},{c:4,r:4},{c:5,r:1}]})},{id:"s4",title:"Wahrheitswerte",render:e=>{e.innerHTML=`
          <div class="slide-centered slide-lesbar">
            <p>Ein Vergleich kann auch als Wert in einer Variablen gespeichert werden. Das Flag l\xE4sst sich aber nicht in eine Datenzelle kopieren. Deshalb fragt der Compiler das Flag mit ${$e("jump","jif")} ab und schreibt selbst die 0 oder die 1. Hier der Weg f\xFCr das Programm: ${dt("number x = 2; boolean ok = x &lt;= 4;")}</p>
            <p>(Z1) ${$e("xfer","mov 2 \u2192 (D1)")} (Z2) ${$e("xfer","mov (D1) \u2192 A")} Wie gewohnt: Deklaration und x in das Register A laden.</p>
            <p>(Z3) ${$e("cmp","&lt;= A, 4")} Der Vergleich. Der Operator wird hier nicht umgekehrt, denn das Flag soll gesetzt sein, wenn der Vergleich wahr ist.</p>
            <p>(Z4) ${$e("jump","jif (Z7)")} Ist das Flag gesetzt, springt die CPU zur 1.</p>
            <p>(Z5) ${$e("xfer","mov 0 \u2192 (D2)")} Der Vergleich war falsch, die 0 kommt in die Zelle von ok.</p>
            <p>(Z6) ${$e("jump","jmp (Z8)")} Die 1 darf nicht auch noch geschrieben werden, deshalb springt die CPU dahinter.</p>
            <p>(Z7) ${$e("xfer","mov 1 \u2192 (D2)")} Der Vergleich war wahr, die 1 kommt in die Zelle von ok.</p>
            <p>(Z8) ${$e("halt","end")} Das Programm ist zu Ende.</p>
            <p>Steht in einer if-Anweisung nur ein Wahrheitswert, zum Beispiel ${dt("if (ok)")}, gibt es keinen Vergleich. Der Compiler l\xE4dt die Variable in ein Register und vergleicht sie mit 0: ${$e("cmp","== A, 0")} setzt das Flag, wenn die Variable falsch ist. Danach springt ${$e("jump","jif")} wie gewohnt hinter den Block.</p>
          </div>

          <div class="slide-centered slide-lesbar">
            <p>Bisher hat der Befehlsz\xE4hler beim Lesen jedes Fachs um eins weitergez\xE4hlt und zeigte nach dem letzten Fach eines Befehls von selbst auf den n\xE4chsten. Ein Sprungbefehl \xE4ndert das: Er setzt den Befehlsz\xE4hler auf ein anderes Fach. ${nt("jump","jmp")} tut das immer, ${nt("jump","jif")} nur, wenn das Flag gesetzt ist. Sonst z\xE4hlt der Befehlsz\xE4hler normal weiter.</p>
            <p>Im Maschinencode steht das Ziel noch als Zeile, zum Beispiel ${nt("jump","jif (Z6)")}. Der Lader rechnet es beim Laden um: Danach zeigt das Ziel auf das Fach, in dem der Zielbefehl beginnt.</p>
            <p>F\xE4cher, die ein Sprung \xFCberspringt, liest die CPU nie. Dasselbe Programm l\xE4uft deshalb mit anderen Werten im Datenspeicher anders ab, je nachdem, ob das Flag bei einem ${nt("jump","jif")} gesetzt ist.</p>

            <p>Deshalb muss die Semantik die Typen vorher pr\xFCfen. Aus ${Fi("true + 1")} w\xFCrde die Maschine einfach 1 + 1 rechnen und 2 herausbekommen, ohne sich zu beschweren. Einen Typfehler gibt es zur Laufzeit nicht, denn der Compiler hat ihn schon vorher abgefangen.</p>
